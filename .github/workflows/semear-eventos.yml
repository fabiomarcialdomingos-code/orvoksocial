# Recria as 4 categorias do Mundo e os 15 eventos pré-cadastrados (rascunho) no banco de
# produção, SEM duplicar o que já existe. Rode pela aba Actions quando "Pré-cadastros"
# estiver vazio. Precisa de uma conta de admin ativa (entre no site ao menos uma vez).
# Precisa do mesmo segredo DATABASE_URL usado pela migração do banco.
name: Semear eventos
on: workflow_dispatch
jobs:
  semear:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir o segredo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Segredo DATABASE_URL não configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Instalar o psql
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Semear categorias e eventos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/semear-eventos.sql
      - name: Contar
        id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          r=$(psql "$DATABASE_URL" -At -c "SELECT 'categorias='||(SELECT count(*) FROM \"WorldCategory\")||' eventos='||(SELECT count(*) FROM \"WorldEvent\")||' rascunhos='||(SELECT count(*) FROM \"WorldEvent\" WHERE status='DRAFT')||' opcoes='||(SELECT count(*) FROM \"WorldOpportunity\")")
          echo "resumo=$r" >> "$GITHUB_OUTPUT"
      - name: "Resultado ${{ steps.c.outputs.resumo }}"
        run: "true"
