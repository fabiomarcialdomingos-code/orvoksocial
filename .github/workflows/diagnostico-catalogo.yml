# Diagnóstico somente leitura do catálogo de perguntas (contagens, sem dados pessoais).
name: Diagnóstico do catálogo
on: workflow_dispatch
jobs:
  contar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contar perguntas
        id: contar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          r=$(psql "$DATABASE_URL" -At -F '/' -c "
            SELECT string_agg(d || ':' || s || '=' || n || ' fam' || f, '; ') FROM (
              SELECT q.domain::text d, v.\"catalogStatus\"::text s, count(DISTINCT q.id) n, count(DISTINCT v.\"familyKey\") f
                FROM \"Question\" q JOIN \"QuestionVersion\" v ON v.\"questionId\"=q.id GROUP BY 1,2) x")
          echo "resumo=${r:-vazio}" >> "$GITHUB_OUTPUT"
      - name: "Resultado ${{ steps.contar.outputs.resumo }}"
        run: "true"
