# Aplica as migrações do banco (Neon) automaticamente.
# Roda quando uma migração nova chega na main, ou manualmente pela aba Actions.
# Precisa do segredo DATABASE_URL: a conexão direta (sem pooling) do dono do banco.
name: Migrar banco

on:
  push:
    branches: [main]
    paths: ["prisma/migrations/**"]
  workflow_dispatch:

concurrency:
  group: migrar-banco
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir o segredo
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Segredo DATABASE_URL não configurado em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Aplicar migrações
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec prisma migrate deploy
