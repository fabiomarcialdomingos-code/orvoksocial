# Consulta SOMENTE LEITURA do banco de produção: quantos eventos existem por status,
# se os 15 pré-cadastrados entraram e se há conta de admin ativa (só contagens, nenhum
# dado de pessoa). O resultado aparece no nome do último passo.
# Precisa do mesmo segredo DATABASE_URL usado pela migração do banco.
name: Consultar eventos
on: workflow_dispatch
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Instalar o psql
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Consultar
        id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          q() { psql "$DATABASE_URL" -At -c "$1" 2>/dev/null | tr '\n' ',' || true; }
          m1=$(q "SELECT count(*) FROM _prisma_migrations WHERE finished_at IS NOT NULL")
          m2=$(q "SELECT substr(migration_name,1,14)||':'||applied_steps_count FROM _prisma_migrations ORDER BY started_at DESC LIMIT 6")
          m3=$(q "SELECT count(*) FROM information_schema.columns WHERE table_name='WorldEvent' AND column_name='notifiedAt'")
          m4=$(q "SELECT count(*) FROM \"WorldCategory\"")
          m5=$(q "SELECT count(*) FROM \"WorldEvent\"")
          m6=$(q "SELECT count(*) FROM \"WorldRound\"")
          m7=$(q "SELECT count(*) FROM \"GuestChallenge\"")
          m8=$(q "SELECT count(*) FROM \"User\"")
          m9=$(q "SELECT count(*) FROM \"User\" WHERE role='ADMIN' AND status='ACTIVE'")
          m10=$(q "SELECT CASE WHEN min(u.\"createdAt\") < (SELECT min(finished_at) FROM _prisma_migrations WHERE migration_name='20260930040000_eventos_pre_cadastrados') THEN 'sim' ELSE 'nao' END FROM \"User\" u WHERE u.role='ADMIN' AND u.status='ACTIVE'")
          m11=$(q "SELECT string_agg(t,'+') FROM (VALUES ('RoundThread'),('UserAgeConsent'),('ProductEvent')) v(t) WHERE to_regclass('public.\"'||t||'\"') IS NOT NULL")
          pe=$(q "SELECT count(*) FROM \"ProductEvent\"")
          pen=$(q "SELECT string_agg(name||':'||n,'+') FROM (SELECT name,count(*) n FROM \"ProductEvent\" GROUP BY name ORDER BY name) x")
          pef=$(q "SELECT coalesce(min(\"createdAt\")::date::text,'-')||'..'||coalesce(max(\"createdAt\")::date::text,'-') FROM \"ProductEvent\"")
          con=$(q "SELECT count(*) FROM \"GuestChallenge\"")
          att=$(q "SELECT count(*) FROM \"GuestChallengeAttempt\"")
          tres=$(q "SELECT count(*) FROM (SELECT \"challengeId\" FROM \"GuestChallengeAttempt\" GROUP BY 1 HAVING count(*)>=3) x")
          usu=$(q "SELECT count(*) FROM \"User\"")
          ses=$(q "SELECT count(*) FROM \"AuthSession\"")
          r="eventosMedidos=$pe porPasso=$pen periodo=$pef convitesCriados=$con visoesRecebidas=$att convitesCom3Visoes=$tres usuarios=$usu sessoes=$ses"
          echo "resumo=$r" >> "$GITHUB_OUTPUT"
      - name: "Resultado ${{ steps.c.outputs.resumo }}"
        run: "true"
