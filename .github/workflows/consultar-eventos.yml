# Consulta SOMENTE LEITURA do banco de produção: quantos eventos existem por status,
# se os 15 pré-cadastrados entraram e se há conta de admin ativa (só contagens, nenhum
# dado de pessoa). O resultado aparece no nome do último passo.
# Precisa do mesmo segredo DATABASE_URL usado pela migração do banco.
name: Consultar eventos
on: workflow_dispatch
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Instalar o psql
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Consultar
        id: c
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          r=$(psql "$DATABASE_URL" -At -c "SELECT 'migracoes=' || (SELECT count(*) FROM \"_prisma_migrations\" WHERE finished_at IS NOT NULL) || ' ultimas=' || (SELECT string_agg(substr(migration_name,1,14) || ':' || applied_steps_count || CASE WHEN finished_at IS NULL THEN ':ABERTA' ELSE '' END, ',' ORDER BY started_at DESC) FROM (SELECT * FROM \"_prisma_migrations\" ORDER BY started_at DESC LIMIT 6) m) || ' colunaNotifiedAt=' || (SELECT count(*) FROM information_schema.columns WHERE table_name='WorldEvent' AND column_name='notifiedAt') || ' tabelas=' || (SELECT string_agg(t, ',') FROM unnest(ARRAY['WorldEvent','WorldCategory','WorldRound','RoundThread','UserAgeConsent','GuestChallenge','ProductEvent']) t WHERE to_regclass('public.\"' || t || '\"') IS NOT NULL) || ' categorias=' || (SELECT count(*) FROM \"WorldCategory\") || ' eventos=' || (SELECT count(*) FROM \"WorldEvent\") || ' rodadas=' || (SELECT count(*) FROM \"WorldRound\") || ' convites=' || (SELECT count(*) FROM \"GuestChallenge\") || ' usuarios=' || (SELECT count(*) FROM \"User\") || ' admins=' || (SELECT count(*) FROM \"User\" WHERE role='ADMIN' AND status='ACTIVE') || ' adminCriadoAntesDaMigracao=' || coalesce((SELECT CASE WHEN min(u.\"createdAt\") < (SELECT min(finished_at) FROM \"_prisma_migrations\" WHERE migration_name='20260930040000_eventos_pre_cadastrados') THEN 'sim' ELSE 'nao' END FROM \"User\" u WHERE u.role='ADMIN' AND u.status='ACTIVE'),'n/a'))
          echo "resumo=$r" >> "$GITHUB_OUTPUT"
      - name: "Resultado ${{ steps.c.outputs.resumo }}"
        run: "true"
