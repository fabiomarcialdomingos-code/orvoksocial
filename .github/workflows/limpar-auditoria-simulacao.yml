# Uso único: apaga o registro de auditoria sem autor (AUTH_LOGIN_REJECTED) deixado pela primeira rodada da
# simulação, entre 08:30 e 08:40 UTC de 06/10/2026. Nada além disso é tocado.
name: "Limpar auditoria da simulação (uso único)"
on: workflow_dispatch
jobs:
  limpar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Instalar o psql
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Apagar
        id: a
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          n=$(psql "$DATABASE_URL" -At -c "WITH x AS (DELETE FROM \"AuditLog\" WHERE \"actorId\" IS NULL AND action='AUTH_LOGIN_REJECTED' AND \"createdAt\" >= '2026-10-06 08:30:00+00' AND \"createdAt\" < '2026-10-06 08:40:00+00' RETURNING 1) SELECT count(*) FROM x")
          echo "resumo=linhas apagadas: $n" >> "$GITHUB_OUTPUT"
      - name: "Resultado ${{ steps.a.outputs.resumo }}"
        run: "true"
