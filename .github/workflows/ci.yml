name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orvok_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orvok_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/orvok_ci?schema=public
      APP_ENV: test
      APP_ORIGIN: http://127.0.0.1:3000
      AUTH_SECRET: ci-only-auth-secret-at-least-32-characters
      AUTH_MAIL_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:validate
      - run: pnpm db:migrate
      - run: pnpm db:verify:clean-database
      - run: pnpm db:verify:incremental-database
      - run: pnpm exec tsx scripts/provision-runtime-roles.ts --local
      - run: pnpm db:verify:consent-migrations
      - run: pnpm db:verify:runtime-boundary
      - run: pnpm db:verify:read-boundary
      - run: pnpm db:verify:radar-rpc
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
