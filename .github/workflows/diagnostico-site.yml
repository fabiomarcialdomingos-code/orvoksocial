# Diagnóstico somente leitura do site publicado: códigos de resposta das rotas.
name: Diagnóstico do site
on: workflow_dispatch
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sondar
        id: s
        run: |
          r=""
          for base in https://orvok.com.br https://www.orvok.com.br https://orvoksocial.vercel.app; do
            h=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/" || echo ERR)
            c=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/desafio/catalogo" || echo ERR)
            p=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/auth/providers" || echo ERR)
            l=$(curl -s -m 20 -X POST "$base/api/v1/auth/login" -H "Content-Type: application/json" -H "Origin: $base" -d '{"email":"diagnostico@example.com","password":"senha-errada-123"}' -w " %{http_code}" | tr -d '\n' | sed -E 's/.*"code":"([A-Z_]+)".* ([0-9]+)$/\1 \2/;s/^(.{0,40}).* ([0-9]+)$/\1 \2/' | tr -cd 'A-Za-z0-9_ <>' )
            pv=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/privacidade" || echo ERR)
            tm=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/termos" || echo ERR)
            home_tem_rede=$(curl -s -m 15 "$base/" | grep -q "Rede ao vivo" && echo SIM || echo nao)
            home_porta=$(curl -s -m 15 "$base/" | grep -q "Começar o meu retrato" && echo SIM || echo nao)
            home_nitidez=$(curl -s -m 15 "$base/" | grep -q "Em revelação" && echo SIM || echo nao)
            home_selos_velhos=$(curl -s -m 15 "$base/" | grep -qE "Selo (Ouro|Prata|Bronze)|<b>(Ouro|Prata|Bronze)</b>" && echo SIM || echo nao)
            home_jogo=$(curl -s -m 15 "$base/" | grep -qiE "Jogar agora|placar|adivinh|desafi" && echo SIM || echo nao)
            mundo=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/mundo/eventos" || echo ERR)
            push=$(curl -s -m 15 "$base/api/v1/push/public-key" | python3 -c "import json,sys;d=json.load(sys.stdin);print('disponivel' if d.get('disponivel') else 'sem-chaves')" 2>/dev/null || echo ERR)
            conversa=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/mundo/rodadas/AAAAAAAA/conversa" || echo ERR)
            og_convite=$(curl -s -o /dev/null -w "%{http_code}" -m 25 "$base/d/AAAAAAAA/opengraph-image" || echo ERR)
            pronto=$(curl -s -o /dev/null -w "%{http_code}" -m 20 "$base/api/ready" || echo ERR)
            origem=$(curl -s -o /dev/null -w "%{http_code}" -m 15 -X POST "$base/api/v1/auth/login" -H "Content-Type: application/json" -H "Origin: $base" -d '{}' || echo ERR)
            conexoes=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/mundo/conexoes" || echo ERR)
            rodada=$(curl -s -o /dev/null -w "%{http_code}" -m 15 "$base/api/v1/mundo/r/AAAAAAAA" || echo ERR)
            ins_entrar=$(curl -s -m 15 "$base/entrar" | grep -o '<script[^>]*>' | grep -v 'src=' | grep -vc 'nonce=' || true)
            ins_comecar=$(curl -s -m 15 "$base/comecar" | grep -o '<script[^>]*>' | grep -v 'src=' | grep -vc 'nonce=' || true)
            cat_perguntas=$(curl -s -m 15 "$base/api/v1/desafio/catalogo" | python3 -c "import json,sys;print(len(json.load(sys.stdin)['perguntas']))" 2>/dev/null || echo ERR)
            r="$r | ${base#https://}: home=$h cat=$c prov=$p login=$l privacidade=$pv termos=$tm redeAoVivoNaHome=$home_tem_rede umaPorta=$home_porta linguagemDeJogoNaHome=$home_jogo nitidezNaHome=$home_nitidez selosAntigosNaHome=$home_selos_velhos perguntas=$cat_perguntas scriptsInlineSemNonce_entrar=$ins_entrar scriptsInlineSemNonce_comecar=$ins_comecar mundoSemLogin=$mundo rodadaInexistente=$rodada conexoesSemLogin=$conexoes prontoStatus=$pronto loginComOrigemDoProprioSite=$origem imagemDoConvite=$og_convite conversaInexistente=$conversa push=$push"
          done
          echo "resumo=$r" >> "$GITHUB_OUTPUT"
      - name: Google
        id: g
        run: |
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" -m 15 "https://orvoksocial.vercel.app/api/v1/auth/google/start")
          ru=$(python3 -c "import sys,urllib.parse as u;q=u.parse_qs(u.urlparse(sys.argv[1]).query);print(q.get('redirect_uri',['-'])[0], '| host=' + u.urlparse(sys.argv[1]).netloc)" "$loc")
          echo "resumo=$ru" >> "$GITHUB_OUTPUT"
      - name: "Google ${{ steps.g.outputs.resumo }}"
        run: "true"
      - name: Permissoes
        id: pm
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          r=$(psql "$DATABASE_URL" -At -c "SELECT string_agg(t || ':' || p, ' ') FROM (SELECT t, p FROM unnest(ARRAY['WorldComment','WorldReaction','WorldPrediction','SocialPost','SocialComment','SocialReaction','UserProfile']) t, unnest(ARRAY['SELECT','INSERT','UPDATE']) p WHERE NOT has_table_privilege('orvok_app_runtime', format('public.%I', t), p)) x")
          echo "resumo=faltando: ${r:-nada}" >> "$GITHUB_OUTPUT"
      - name: "Permissoes ${{ steps.pm.outputs.resumo }}"
        run: "true"
      - name: Banco
        id: b
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          r=$(psql "$DATABASE_URL" -At -c "SELECT 'papeis=' || coalesce((SELECT string_agg(rolname || (CASE WHEN rolcanlogin THEN '+login' ELSE '' END), ',') FROM pg_roles WHERE rolname LIKE 'orvok_%'),'nenhum') || ' usuarios=' || (SELECT count(*) FROM \"User\") || ' identidades=' || (SELECT count(*) FROM \"AuthIdentity\") || ' verificadas=' || (SELECT count(*) FROM \"AuthIdentity\" WHERE \"verifiedAt\" IS NOT NULL) || ' sessoes=' || (SELECT count(*) FROM \"AuthSession\")")
          echo "resumo=$r" >> "$GITHUB_OUTPUT"
      - name: "Banco ${{ steps.b.outputs.resumo }}"
        run: "true"
      - name: "Resultado ${{ steps.s.outputs.resumo }}"
        run: "true"
